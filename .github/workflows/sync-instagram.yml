name: Sync Instagram feed

on:
  push:
    branches:
      - main
    paths:
      - instagram.json
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Instagram posts
        env:
          META_APP_TOKEN: ${{ secrets.META_APP_TOKEN }}
        run: python3 scripts/sync-instagram.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram.json images/
          if git diff --staged --quiet; then
            echo "No Instagram changes to commit."
          else
            git commit -m "Sync Instagram feed [skip ci]"
            git push
          fi