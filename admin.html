<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative DBB • Admin</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #ddd; padding: 40px; max-width: 1100px; margin: 0 auto; }
  h1 { color: #e0a93c; }
  .project-card { background: #1a1a1a; border: 1px solid #333; padding: 24px; margin-bottom: 30px; border-radius: 8px; }
  .project-card h3 { margin-top: 0; color: #e0a93c; }
  label { display: block; margin: 12px 0 6px; font-size: 14px; color: #aaa; }
  input, textarea { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #ddd; border-radius: 4px; font-size: 15px; }
  textarea { min-height: 80px; }
  .image-preview { margin: 12px 0; max-width: 300px; border: 1px solid #444; }
  .btn { background: #e0a93c; color: #111; padding: 14px 32px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 4px; margin-top: 20px; }
  .btn:hover { background: #f0cd84; }
  .status { margin-top: 20px; padding: 12px; background: #222; border-radius: 4px; }
  .warning { color: #ffcc00; font-size: 13px; }
</style>
</head>
<body>

<h1>Creative DBB — Admin Panel</h1>
<p class="warning">This admin uses a GitHub token. Changes will be committed directly to your repository.</p>

<div style="margin-bottom: 20px;">
  <button class="btn" onclick="addNewProject()" style="background:#333; color:#ddd;">+ Add New Project</button>
</div>

<div id="projects-container"></div>

<button class="btn" onclick="publishChanges()">Publish Changes to Website</button>

<div class="status" id="status"></div>

<p style="margin-top:40px; font-size:13px; color:#666;">
  Note: Only the <strong>latest 4 projects</strong> (sorted by newest first) will appear on the website.
</p>

<script>
// ==================== CONFIGURATION ====================
const GITHUB_TOKEN = "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";
const REPO_OWNER = "abendanjulius";
const REPO_NAME = "dbb";
const BRANCH = "main";

// Current projects data (will be loaded from projects.json)
let projects = [];

// Store converted WebP images temporarily { index: { base64, filename } }
let convertedImages = {};

// Load existing projects.json
async function loadProjects() {
  try {
    const res = await fetch('projects.json');
    projects = await res.json();
    renderAdminForm();
  } catch (err) {
    document.getElementById('status').innerHTML = 'Error loading projects.json';
    console.error(err);
  }
}

// Render form for each project
function renderAdminForm() {
  const container = document.getElementById('projects-container');
  container.innerHTML = '';

  projects.forEach((project, index) => {
    const div = document.createElement('div');
    div.className = 'project-card';
    div.innerHTML = `
      <h3 style="display:flex; justify-content:space-between; align-items:center;">
        Project ${index + 1}: ${project.name || 'New Project'}
        <button onclick="deleteProject(${index})" style="background:#c33; color:white; border:none; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px;">Delete</button>
      </h3>
      
      <label>Project Name</label>
      <input type="text" id="name-${index}" value="${project.name || ''}">

      <label>Tag</label>
      <select id="tag-${index}">
        <option value="">-- Select Tag --</option>
        <option value="Perfumery · Boutique">Perfumery · Boutique</option>
        <option value="Perfumery · Heritage">Perfumery · Heritage</option>
        <option value="Perfumery · Modern">Perfumery · Modern</option>
        <option value="F&B · Multi-Location">F&B · Multi-Location</option>
        <option value="F&B Excellence">F&B Excellence</option>
        <option value="Luxury Retail">Luxury Retail</option>
        <option value="International Hospitality">International Hospitality</option>
        <option value="Project Management">Project Management</option>
        <option value="Architectural Design">Architectural Design</option>
        <option value="Interior Fit-Out">Interior Fit-Out</option>
        <option value="Bespoke Joinery">Bespoke Joinery</option>
      </select>

      <label>Location</label>
      <input type="text" id="location-${index}" value="${project.location || ''}">

      <label>Description</label>
      <textarea id="description-${index}">${project.description || ''}</textarea>

      ${project.image ? `
        <label>Current Image</label>
        <img src="${project.image}" class="image-preview" style="max-height:160px; object-fit:cover;">
      ` : ''}

      <label>Upload New Image</label>
      <input type="file" id="image-${index}" accept="image/*" onchange="handleImageUpload(this, ${index})">
      <div id="conversion-status-${index}" style="font-size:13px; color:#e0a93c; margin-top:6px; display:none;"></div>
    `;
    container.appendChild(div);
  });
}

// Add a new blank project
function addNewProject() {
  const newId = projects.length > 0 ? Math.max(...projects.map(p => p.id)) + 1 : 1;
  
  projects.unshift({
    id: newId,
    name: "",
    tag: "",
    location: "",
    image: "",
    description: ""
  });

  renderAdminForm();
}

// Delete a project
function deleteProject(index) {
  if (!confirm("Delete this project?")) return;
  projects.splice(index, 1);
  renderAdminForm();
}

// Convert and store image immediately after upload
async function handleImageUpload(input, index) {
  const statusDiv = document.getElementById(`conversion-status-${index}`);
  if (!input.files.length) return;

  const file = input.files[0];
  statusDiv.style.display = 'block';
  statusDiv.style.color = '#e0a93c';
  statusDiv.innerHTML = `Converting <strong>${file.name}</strong> to WebP...`;

  try {
    // Actual conversion happens here
    const webpBase64 = await convertToWebP(file);
    const newFileName = `images/project-${Date.now()}-${index}.webp`;

    // Store converted image
    convertedImages[index] = {
      base64: webpBase64,
      filename: newFileName
    };

    statusDiv.innerHTML = `✓ Converted to WebP • Ready to publish`;
    statusDiv.style.color = '#4ade80';

    // Optional: Show small preview of converted image
    showWebPPreview(index, webpBase64);

  } catch (err) {
    statusDiv.innerHTML = `Error converting image`;
    statusDiv.style.color = '#f87171';
    console.error(err);
  }
}

// Show a small preview of the converted WebP
function showWebPPreview(index, webpBase64) {
  const statusDiv = document.getElementById(`conversion-status-${index}`);
  if (!statusDiv) return;

  const previewImg = document.createElement('img');
  previewImg.src = `data:image/webp;base64,${webpBase64}`;
  previewImg.style.cssText = 'max-width:120px; max-height:80px; margin-top:8px; border:1px solid #444; border-radius:4px; display:block;';

  // Remove old preview if exists
  const oldPreview = statusDiv.querySelector('.webp-preview');
  if (oldPreview) oldPreview.remove();

  previewImg.className = 'webp-preview';
  statusDiv.appendChild(previewImg);
}

// Convert image file to WebP and return as base64
function convertToWebP(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        // Convert to WebP with 85% quality
        const webpDataUrl = canvas.toDataURL('image/webp', 0.85);
        resolve(webpDataUrl.split(',')[1]); // return base64 without prefix
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Publish changes using GitHub API
async function publishChanges() {
  const statusEl = document.getElementById('status');
  statusEl.innerHTML = 'Preparing changes...';

  try {
    // Update projects array from form
    projects.forEach((project, index) => {
      project.name = document.getElementById(`name-${index}`).value;
      project.tag = document.getElementById(`tag-${index}`).value;
      project.location = document.getElementById(`location-${index}`).value;
      project.description = document.getElementById(`description-${index}`).value;
    });

    // Upload pre-converted images (if user uploaded new ones)
    for (let i = 0; i < projects.length; i++) {
      if (convertedImages[i]) {
        const { base64, filename } = convertedImages[i];
        projects[i].image = filename;

        statusEl.innerHTML = `Uploading image for project ${i + 1}...`;
        await uploadFileToGitHub(filename, base64, `Add new image for ${projects[i].name}`);

        // Clear after upload
        delete convertedImages[i];
      }
    }

    // Filter out projects with empty names before saving
    const projectsToSave = projects.filter(p => p.name && p.name.trim() !== '');

    // Update projects.json
    statusEl.innerHTML = 'Updating projects.json...';
    const jsonContent = JSON.stringify(projectsToSave, null, 2);
    const jsonBase64 = btoa(unescape(encodeURIComponent(jsonContent)));

    await uploadFileToGitHub('projects.json', jsonBase64, 'Update projects via Admin Panel');

    statusEl.innerHTML = '✅ Successfully published! Only the latest 4 projects will show on the website.';
    alert('Changes published successfully! Please wait 1-2 minutes for GitHub Pages to update.');

  } catch (error) {
    console.error(error);
    statusEl.innerHTML = 'Error: ' + error.message;
    alert('Failed to publish. Check console for details.');
  }
}

// Upload file to GitHub using Contents API
async function uploadFileToGitHub(path, contentBase64, commitMessage) {
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;

  // First, try to get existing file SHA (required for updates)
  let sha = null;
  try {
    const getRes = await fetch(url, {
      headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
    });
    if (getRes.ok) {
      const data = await getRes.json();
      sha = data.sha;
    }
  } catch (e) {}

  const body = {
    message: commitMessage,
    content: contentBase64,
    branch: BRANCH
  };
  if (sha) body.sha = sha;

  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${GITHUB_TOKEN}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || 'Failed to upload file');
  }
  return res.json();
}

// Initialize
loadProjects();
</script>

</body>
</html>
