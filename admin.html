<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative DBB • Admin</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #ddd; padding: 40px; max-width: 1100px; margin: 0 auto; }
  h1 { color: #e0a93c; }
  .project-card { background: #1a1a1a; border: 1px solid #333; padding: 24px; margin-bottom: 30px; border-radius: 8px; }
  .project-card h3 { margin-top: 0; color: #e0a93c; }
  label { display: block; margin: 12px 0 6px; font-size: 14px; color: #aaa; }
  input, textarea { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #ddd; border-radius: 4px; font-size: 15px; }
  textarea { min-height: 80px; }
  .image-preview { margin: 12px 0; max-width: 300px; border: 1px solid #444; }
  .btn { background: #e0a93c; color: #111; padding: 14px 32px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 4px; margin-top: 20px; }
  .btn:hover { background: #f0cd84; }
  .status { margin-top: 20px; padding: 12px; background: #222; border-radius: 4px; }
  .warning { color: #ffcc00; font-size: 13px; }
</style>
</head>
<body>

<h1>Creative DBB — Admin Panel</h1>
<p class="warning">This admin uses a GitHub token. Changes will be committed directly to your repository.</p>

<div id="projects-container"></div>

<button class="btn" onclick="publishChanges()">Publish Changes to Website</button>

<div class="status" id="status"></div>

<script>
// ==================== CONFIGURATION ====================
const GITHUB_TOKEN = "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";
const REPO_OWNER = "abendanjulius";
const REPO_NAME = "dbb";
const BRANCH = "main";

// Current projects data (will be loaded from projects.json)
let projects = [];

// Load existing projects.json
async function loadProjects() {
  try {
    const res = await fetch('projects.json');
    projects = await res.json();
    renderAdminForm();
  } catch (err) {
    document.getElementById('status').innerHTML = 'Error loading projects.json';
    console.error(err);
  }
}

// Render form for each project
function renderAdminForm() {
  const container = document.getElementById('projects-container');
  container.innerHTML = '';

  projects.forEach((project, index) => {
    const div = document.createElement('div');
    div.className = 'project-card';
    div.innerHTML = `
      <h3>Project ${index + 1}: ${project.name}</h3>
      
      <label>Project Name</label>
      <input type="text" id="name-${index}" value="${project.name}">

      <label>Tag (e.g. Perfumery · Boutique)</label>
      <input type="text" id="tag-${index}" value="${project.tag}">

      <label>Location</label>
      <input type="text" id="location-${index}" value="${project.location}">

      <label>Description</label>
      <textarea id="description-${index}">${project.description}</textarea>

      <label>Current Image</label>
      <img src="${project.image}" class="image-preview" style="max-height:160px; object-fit:cover;">

      <label>Upload New Image (will be converted to WebP)</label>
      <input type="file" id="image-${index}" accept="image/*">
    `;
    container.appendChild(div);
  });
}

// Convert image file to WebP and return as base64
function convertToWebP(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        // Convert to WebP with 85% quality
        const webpDataUrl = canvas.toDataURL('image/webp', 0.85);
        resolve(webpDataUrl.split(',')[1]); // return base64 without prefix
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Publish changes using GitHub API
async function publishChanges() {
  const statusEl = document.getElementById('status');
  statusEl.innerHTML = 'Preparing changes...';

  try {
    // Update projects array from form
    projects.forEach((project, index) => {
      project.name = document.getElementById(`name-${index}`).value;
      project.tag = document.getElementById(`tag-${index}`).value;
      project.location = document.getElementById(`location-${index}`).value;
      project.description = document.getElementById(`description-${index}`).value;
    });

    // Handle image uploads
    for (let i = 0; i < projects.length; i++) {
      const fileInput = document.getElementById(`image-${i}`);
      if (fileInput.files.length > 0) {
        statusEl.innerHTML = `Converting image for project ${i + 1}...`;
        const webpBase64 = await convertToWebP(fileInput.files[0]);
        
        // Generate new filename
        const newFileName = `images/project-${Date.now()}-${i}.webp`;
        projects[i].image = newFileName;

        // Upload image to GitHub
        await uploadFileToGitHub(newFileName, webpBase64, `Add new image for ${projects[i].name}`);
      }
    }

    // Update projects.json
    statusEl.innerHTML = 'Updating projects.json...';
    const jsonContent = JSON.stringify(projects, null, 2);
    const jsonBase64 = btoa(unescape(encodeURIComponent(jsonContent)));

    await uploadFileToGitHub('projects.json', jsonBase64, 'Update featured projects via Admin');

    statusEl.innerHTML = '✅ Successfully published! Changes will appear on the website shortly.';
    alert('Changes published successfully! Please wait 1-2 minutes for GitHub Pages to update.');

  } catch (error) {
    console.error(error);
    statusEl.innerHTML = 'Error: ' + error.message;
    alert('Failed to publish. Check console for details.');
  }
}

// Upload file to GitHub using Contents API
async function uploadFileToGitHub(path, contentBase64, commitMessage) {
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;

  // First, try to get existing file SHA (required for updates)
  let sha = null;
  try {
    const getRes = await fetch(url, {
      headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
    });
    if (getRes.ok) {
      const data = await getRes.json();
      sha = data.sha;
    }
  } catch (e) {}

  const body = {
    message: commitMessage,
    content: contentBase64,
    branch: BRANCH
  };
  if (sha) body.sha = sha;

  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${GITHUB_TOKEN}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || 'Failed to upload file');
  }
  return res.json();
}

// Initialize
loadProjects();
</script>

</body>
</html>
